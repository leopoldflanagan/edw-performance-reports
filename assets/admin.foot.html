</div></main>
<footer>__SITE__ &middot; __TEAMNAME__ &middot; __ORG__</footer>
<script>
/* Admin dashboard. Everything here is fixable by editing Jira, which is why it
   lives away from the reports: the index is for stakeholders, this is for whoever
   keeps the board honest. Two severities only, because a page where everything is
   red says nothing:

     Blocking  - the Definition of Ready, as the team's own Backlog Organization
                 Guide writes it. The gate is Ready for Development, not the sprint.
     Debt      - useful for reporting, does not stop the sprint. */
(function () {
  var host = document.getElementById('adminpanel');
  if (!host) return;

  var esc = function (s) {
    return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  };
  var ago = function (iso) {
    var m = Math.round((Date.now() - new Date(iso).getTime()) / 60000);
    if (!isFinite(m)) return '';
    if (m < 2) return 'less than a minute ago';
    if (m < 60) return m + ' min ago';
    var h = Math.round(m / 60);
    return h < 24 ? h + 'h ago' : Math.round(h / 24) + 'd ago';
  };
  var JIRA = 'https://wellfit.atlassian.net/browse/';
  function freshness(iso) {
    if (!iso || iso.slice(0, 4) === '1970') {
      return '<span class="fresh fresh-wait"><i></i>Waiting for the first refresh</span>';
    }
    var mins = Math.round((Date.now() - new Date(iso).getTime()) / 60000);
    var when = new Date(iso).toLocaleString(undefined, { month: 'short', day: 'numeric',
                                                         hour: 'numeric', minute: '2-digit' });
    var cls = mins > 90 ? 'fresh-bad' : (mins > 45 ? 'fresh-warn' : 'fresh-ok');
    var say = mins > 90 ? 'Data may be stale' : (mins > 45 ? 'Refresh running late' : 'Data up to date');
    return '<span class="fresh ' + cls + '"><i></i>' + say + ' <b>&middot; ' + esc(when) + '</b></span>';
  }
  /* Backlog health. One number with bands, so it is a stat with a scale rather
     than a chart: how many sprints of ready work are waiting. State is shown as a
     labelled lozenge, never by colour alone. */
  function backlogBlock(b) {
    if (!b || b.runway == null) return '';
    var spr = function (n) { return n + ' sprint' + (n === 1 ? '' : 's'); };
    var st = b.state || '';
    var cls = st === 'In shape' ? 'bh-shape' : (st === 'Fat' ? 'bh-fat' : 'bh-skinny');
    var ic  = st === 'In shape' ? '&#10003;' : (st === 'Fat' ? '&#9679;' : '&#9888;');

    // the band runs 0 to 4 sprints; zones are 1.5 and 2.5
    var MAX = 4, pos = Math.min(b.runway, MAX) / MAX * 100;
    var zones = '<div class="bhzones">' +
      '<i style="width:37.5%;background:#f3b9bf"></i>' +
      '<i style="width:25%;background:#bfe3a8"></i>' +
      '<i style="width:37.5%;background:#f8d3b4"></i></div>' +
      '<div class="bhmark"><b style="left:' + pos.toFixed(1) + '%"></b></div>' +
      '<div class="bhticks"><span>0 &middot; Skinny</span><span>1.5</span>' +
      '<span>2.5</span><span>4+ &middot; Fat</span></div>';

    var fix = '';
    if (b.misfiled && b.misfiled.items && b.runway_if_fixed != null) {
      fix = '<div class="goalbox" style="margin-top:10px">' +
        '<b>' + b.misfiled.points + ' more points are ready but filed wrong.</b> ' +
        b.misfiled.items + ' items are marked <i>Groomed</i> and still sit in <i>Backlog</i>, ' +
        'which the Backlog Organization Guide does not allow. Planning cannot see them. ' +
        'Corrected, the runway would be <b>' + spr(b.runway_if_fixed) + '</b>' +
        (b.state_if_fixed && b.state_if_fixed !== st ? ' &mdash; ' + b.state_if_fixed : ' &mdash; still ' + st) +
        '.</div>';
    }

    var rows = (b.violations || []).filter(function (v) { return v.n > 0; })
      .map(function (v) {
        return '<div class="drow"><span class="dn">' + v.n + ' item' + (v.n === 1 ? '' : 's') +
          (v.points ? ' &middot; ' + v.points + ' pts' : '') + '</span>' +
          '<span><b>' + esc(v.rule) + '</b><br><span class="dwhy">' + esc(v.why) + '</span></span></div>';
      }).join('');
    var dor = rows
      ? '<div class="sk" style="margin-top:14px">Definition of Ready &middot; what the guide does not allow</div>' +
        '<div class="dor">' + rows + '</div>'
      : '<div class="goalbox" style="margin-top:10px"><span class="ok">&#10003;</span> ' +
        'No Definition of Ready violations.</div>';

    return '<div class="sprintsec"><div class="sk">Backlog health</div>' +
      '<div class="bh">' +
        '<div class="hero"><div class="bhstate ' + cls + '"><span class="ic">' + ic + '</span>' +
          esc(st) + '</div>' +
          '<div class="hv">' + b.runway + ' <span style="font-size:15px;font-weight:600">sprints</span></div>' +
          '<div class="hs">of ready work waiting</div></div>' +
        '<div class="bhband">' + zones +
          '<div class="hs" style="margin-top:8px">' + b.ready.points + ' pts groomed and ready to pull' +
          (b.per_sprint_pts ? ', against <b>' + b.per_sprint_pts + ' pts</b> delivered per sprint' : '') +
          '. Two sprints is one release, so that is the target.</div>' +
        '</div>' +
      '</div>' + fix + dor + '</div>';
  }

  function checks(list, kind) {
    if (!list || !list.length) {
      return '<div class="goalbox"><span style="color:var(--healthy)">&#10003;</span> ' +
        'Nothing ' + (kind === 'blocking' ? 'blocking' : 'outstanding') + ' right now.</div>';
    }
    return list.map(function (c) {
      var keys = (c.items || []).map(function (i) {
        return '<a href="' + JIRA + i.key + '" title="' + esc(i.summary) + '">' + esc(i.key) + '</a>';
      }).join(', ');
      var more = c.items && c.n > c.items.length ? ' and ' + (c.n - c.items.length) + ' more' : '';
      return '<div class="ck ck-' + kind + '">' +
        '<div class="cn">' + c.n + '</div>' +
        '<div><div class="cr">' + esc(c.rule) + '</div>' +
        '<div class="cw">' + esc(c.why) + '</div>' +
        (keys ? '<div class="ci">' + keys + more + '</div>' : '') +
        '</div></div>';
    }).join('');
  }

  function render(d) {
    var a = d.admin || {}, out = '';
    var nb = (a.blocking || []).reduce(function (s, c) { return s + c.n; }, 0);
    var nd = (a.debt || []).reduce(function (s, c) { return s + c.n; }, 0);

    out += '<div class="activewrap">' +
      '<div class="liverow">' +
      '<span class="activetag"' + (nb ? '' : ' style="background:var(--healthy)"') + '>' +
      (nb ? nb + ' blocking' : 'Nothing blocking') + '</span>' +
      freshness(d.generated) + '</div>' +
      '<div style="font-size:21px;font-weight:800;color:var(--wf-blue-d);line-height:1.2">' +
        'Definition of Ready</div>' +
      '<div class="secsub" style="margin:2px 0 12px;font-size:13px">' +
        'Checked on everything in <b>Ready for Development</b> and in <b>' +
        esc((a.scope && a.scope.sprint_name) || 'the active sprint') + '</b>. ' +
        'The gate is Ready for Development, not the sprint &mdash; an item that gets that far ' +
        'without meeting DoR is a planning problem one step before anyone sees it.</div>' +
      checks(a.blocking, 'blocking') + '</div>';

    if (a.setup && a.setup.length) {
      out += '<div class="sprintsec"><div class="sk">Sprint setup</div>' +
        checks(a.setup, 'blocking') + '</div>';
    }

    out += backlogBlock(d.backlog);

    out += '<div class="sprintsec"><div class="sk">Administrative debt &middot; ' + nd +
      ' item' + (nd === 1 ? '' : 's') + '</div>' +
      '<div class="secsub" style="font-size:12.5px;margin:-2px 0 8px">Useful for reporting, ' +
      'does not stop the sprint. A field missing on nearly everything is reported as a field ' +
      'the team does not use, not as one warning per item.</div>' +
      checks(a.debt, 'debt') + '</div>';

    out += '<div class="secsub" style="margin-top:16px;font-size:12.5px">' +
      '<a href="index.html">&larr; back to the reports</a> &middot; ' +
      '<a href="sprint.html">active sprint</a></div>';
    host.innerHTML = out;
  }

  fetch('data/live.json?t=' + Date.now(), { cache: 'no-store' })
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(render)
    .catch(function () {
      host.innerHTML = '<div class="goalbox">Live data is not available yet.</div>';
    });
})();
</script>
</body></html>
