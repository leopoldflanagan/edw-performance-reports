<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700;9..40,800&display=swap');

  :root{
    --wf-blue:#007CBC; --wf-blue-d:#005f91; --wf-blue-l:#65B2D5; --wf-blue-bg:#e5f2f8;
    --wf-green:#4FA800; --wf-ink:#32373c; --wf-muted:#626c84; --wf-muted2:#69727d;
    --line:#e2e8f0; --bg:#f5f8fb; --card:#ffffff;
    --shadow:0 1px 3px rgba(0,124,188,.05),0 6px 22px rgba(50,55,60,.06);
    --healthy:#4FA800; --warning:#ED7D31; --risk:#d64550;
    --healthy-bg:#eef7e3; --warning-bg:#fdeee3; --risk-bg:#fbeced;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--wf-ink);line-height:1.55;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1180px;margin:0 auto;padding:0 24px}
  a{color:var(--wf-blue);text-decoration:none}
  a:hover{text-decoration:underline}

  header{background:linear-gradient(135deg,#005f91 0%,#007CBC 100%);color:#fff;padding:38px 0 32px;position:relative;overflow:hidden}
  header::after{content:"";position:absolute;right:-90px;top:-90px;width:360px;height:360px;border-radius:50%;background:radial-gradient(circle,rgba(101,178,213,.35),transparent 70%)}
  .eyebrow{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--wf-blue-l);font-weight:700}
  header h1{font-weight:800;font-size:40px;line-height:1.05;margin:8px 0 6px;letter-spacing:-.02em}
  header .sub{color:#cfe7f3;font-size:15px;max-width:660px}
  .statuspill{display:inline-flex;align-items:center;gap:9px;margin-top:18px;background:rgba(237,125,49,.22);border:1px solid rgba(237,125,49,.55);color:#ffd9bf;padding:8px 16px;border-radius:999px;font-weight:600;font-size:14px}
  .statuspill .dot{width:10px;height:10px;border-radius:50%;background:var(--warning);box-shadow:0 0 0 4px rgba(237,125,49,.28)}

  .tabs{position:sticky;top:0;z-index:30;background:rgba(245,248,251,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
  .tabs .wrap{display:flex;gap:4px}
  .tab{appearance:none;background:none;border:none;font-family:'DM Sans';font-weight:600;font-size:15px;color:var(--wf-muted);padding:17px 22px;cursor:pointer;position:relative;transition:color .2s}
  .tab:hover{color:var(--wf-ink)}
  .tab.active{color:var(--wf-blue)}
  .tab.active::after{content:"";position:absolute;left:14px;right:14px;bottom:-1px;height:3px;background:var(--wf-blue);border-radius:3px 3px 0 0}

  main{padding:34px 0 70px}
  .panel{display:none;animation:fade .4s ease}
  .panel.active{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

  .sectit{font-weight:800;font-size:24px;color:var(--wf-blue-d);margin:6px 0 2px;letter-spacing:-.01em}
  .secsub{color:var(--wf-muted);font-size:14px;margin-bottom:20px}

  .grid{display:grid;gap:18px}
  .g3{grid-template-columns:repeat(3,1fr)}
  .g2{grid-template-columns:repeat(2,1fr)}
  @media(max-width:860px){.g3,.g2{grid-template-columns:1fr}}

  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:var(--shadow);position:relative}
  .card .ghead{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
  .g3>.card{display:flex;flex-direction:column}
  .card .gname{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--wf-muted);font-weight:700}
  .cardfill{flex:1}
  .docsep{border:none;border-top:1px dashed var(--line);margin:14px 0 0}
  .badge{font-size:11px;font-weight:700;padding:4px 10px;border-radius:999px;display:inline-flex;align-items:center;gap:6px}
  .badge .d{width:7px;height:7px;border-radius:50%}
  .b-green{background:var(--healthy-bg);color:#3a7d00}.b-green .d{background:var(--healthy)}
  .b-amber{background:var(--warning-bg);color:#a9760a}.b-amber .d{background:var(--warning)}
  .b-red{background:var(--risk-bg);color:#b3303b}.b-red .d{background:var(--risk)}

  .bignum{font-weight:800;font-size:40px;font-variant-numeric:proportional-nums;line-height:1;color:var(--wf-blue-d);letter-spacing:-.02em}
  .bignum .unit{font-size:15px;color:var(--wf-muted);font-weight:600;margin-left:4px}
  .secondary{font-size:13px;color:var(--wf-muted);margin-top:7px}
  .secondary b{color:var(--wf-ink)}
  .targetline{display:inline-flex;align-items:center;gap:6px;margin-top:10px;font-size:12px;background:#f0f4f8;border:1px solid var(--line);padding:4px 10px;border-radius:7px;color:var(--wf-muted2)}
  .targetline .tl{font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--wf-blue);font-size:10px}

  .deltarow{display:flex;gap:18px;margin-top:14px;padding-top:14px;border-top:1px dashed var(--line)}
  .delta{font-size:13px}.delta .lbl{color:var(--wf-muted);font-size:10px;text-transform:uppercase;letter-spacing:.05em;display:block;margin-bottom:2px;font-weight:700}
  .delta.primary .lbl{color:var(--wf-blue)}
  .pos{color:var(--healthy);font-weight:700}.neg{color:var(--risk);font-weight:700}.flat{color:var(--wf-muted);font-weight:700}

  .infopanel{margin-top:14px;border-radius:10px;padding:11px 13px;font-size:12.5px;line-height:1.45}
  .infopanel.ip-green{background:var(--healthy-bg);border-left:3px solid var(--healthy);color:#36631a}
  .infopanel.ip-amber{background:var(--warning-bg);border-left:3px solid var(--warning);color:#8a6200}
  .infopanel.ip-red{background:var(--risk-bg);border-left:3px solid var(--risk);color:#9c2a34}
  .infopanel b{font-weight:700}
  .ip-link{font-weight:700;color:inherit;text-decoration:underline;text-underline-offset:2px;white-space:nowrap}
  .ip-link:hover{opacity:.75}

  .doclink{display:inline-flex;align-items:center;gap:5px;margin-top:12px;font-size:12px;font-weight:600;color:var(--wf-blue)}
  .doclink::before{content:"📄";font-size:12px}
  .bignum.num-green{color:var(--healthy)}
  .bignum.num-amber{color:var(--warning)}
  .bignum.num-red{color:var(--risk)}
  .num-green .unit,.num-amber .unit,.num-red .unit{color:inherit;opacity:.85}

  .chartbox{position:relative;height:200px;margin-top:6px}
  .chartbox.tall{height:240px}
  .centerbox{display:flex;flex-direction:column;align-items:center;justify-content:center}

  .mixcard{display:flex;flex-direction:column}
  .mixbody{flex:1;display:flex;align-items:center;justify-content:center;gap:30px;padding:10px 0;flex-wrap:wrap}
  .donutwrap{position:relative;width:200px;height:200px;flex-shrink:0}
  .donutctr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none}
  .dc-num{font-size:42px;font-weight:800;color:var(--risk);line-height:1}
  .dc-lbl{font-size:11px;color:var(--wf-muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600;margin-top:2px;text-align:center;line-height:1.3}
  .mixlegend{display:flex;flex-direction:column;gap:14px}
  .ml-row{display:flex;align-items:center;gap:10px;font-size:14px}
  .ml-sw{width:14px;height:14px;border-radius:4px;flex-shrink:0}
  .ml-nm{font-weight:600;color:var(--wf-ink);min-width:78px}
  .ml-val{color:var(--wf-muted);font-weight:600}

  .wipwrap{width:100%;margin:14px 0 0}
  .wipcard{display:flex;flex-direction:column}
  .wiptotal{display:flex;align-items:center;gap:16px;background:linear-gradient(135deg,#f3f9fc,#e8f3f9);border:1px solid var(--wf-blue-bg);border-radius:12px;padding:14px 18px;margin-bottom:4px}
  .wt-num{font-size:38px;font-weight:800;color:var(--wf-blue-d);line-height:1}
  .wt-den{font-size:18px;color:var(--wf-muted);font-weight:600;margin-left:2px}
  .wt-lbl{font-size:12.5px;color:var(--wf-muted);line-height:1.4}
  .wt-lbl b{color:var(--healthy)}
  .wiprow{display:flex;align-items:center;gap:10px;margin:9px 0}
  .wiprow .nm{width:120px;font-size:13px;font-weight:600;color:var(--wf-ink)}
  .wipbar{flex:1;height:22px;background:#eef2f8;border-radius:6px;position:relative;overflow:hidden}
  .wipfill{height:100%;border-radius:6px;background:linear-gradient(90deg,var(--wf-blue),var(--wf-blue-l));display:flex;align-items:center;justify-content:flex-end;padding-right:7px;color:#fff;font-size:11px;font-weight:700}
  .wiplim{width:50px;text-align:right;font-size:12px;color:var(--wf-muted);font-weight:600}

  .note{background:var(--wf-blue-bg);border-left:3px solid var(--wf-blue);border-radius:0 10px 10px 0;padding:12px 14px;font-size:13px;color:#244b5e;margin-top:16px}
  .note b{color:var(--wf-blue-d)}

  table.exec{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:var(--shadow)}
  table.exec th{background:var(--wf-blue-d);color:#fff;font-size:12px;letter-spacing:.04em;text-transform:uppercase;font-weight:600;padding:12px 14px;text-align:center}
  table.exec th:first-child{text-align:left}
  table.exec td{padding:13px 14px;text-align:center;font-size:14px;border-bottom:1px solid var(--line)}
  table.exec td:first-child{text-align:left;font-weight:700;color:var(--wf-blue-d)}
  table.exec tr:last-child td{border-bottom:none}
  table.exec tr:nth-child(even) td{background:#f8fbfd}
  .st-dot{display:inline-block;width:11px;height:11px;border-radius:50%}

  .cmpcard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:var(--shadow);margin-bottom:18px}
  .cmpcard h3{font-size:20px;color:var(--wf-blue-d);font-weight:700;display:flex;align-items:center;gap:10px}
  .cmphead{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:4px;flex-wrap:wrap;gap:8px}
  .cmpgrid{display:grid;grid-template-columns:1.3fr 1fr;gap:24px;align-items:center;margin-top:8px}
  @media(max-width:860px){.cmpgrid{grid-template-columns:1fr}}
  .readout{font-size:14px;color:#33425c}
  .readout .line{margin:10px 0;padding-left:14px;border-left:3px solid var(--line)}
  .readout .line b{color:var(--wf-blue-d)}
  .vs-tag{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--wf-muted);font-weight:700}

  .splitwrap{display:grid;grid-template-columns:300px 1fr;gap:28px;align-items:center}
  @media(max-width:860px){.splitwrap{grid-template-columns:1fr}}
  .originbar{margin:10px 0}
  .originbar .top{display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px}
  .originbar .top .nm{font-weight:600;color:var(--wf-ink)}
  .originbar .top .pct{font-weight:700;color:var(--wf-blue-d)}
  .obtrack{height:14px;background:#eef2f8;border-radius:7px;overflow:hidden}
  .obfill{height:100%;border-radius:7px}

  .ticket{display:flex;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);font-size:13px;align-items:flex-start}
  .ticket:last-child{border:none}
  .tkey{font-weight:700;color:var(--wf-blue);min-width:78px}
  .tdesc{flex:1;color:#33425c}
  .ttag{font-size:10px;font-weight:700;padding:3px 8px;border-radius:6px;white-space:nowrap;align-self:center}
  .tg-rec{background:var(--warning-bg);color:#a9760a}
  .tg-pred{background:var(--wf-blue-bg);color:#1d6a93}
  .tg-real{background:var(--risk-bg);color:#b3303b}

  .insightbox{background:linear-gradient(135deg,#005f91,#007CBC);color:#fff;border-radius:18px;padding:26px 28px;margin:8px 0 26px;position:relative;overflow:hidden}
  .insightbox::after{content:"";position:absolute;right:-40px;bottom:-60px;width:230px;height:230px;border-radius:50%;background:radial-gradient(circle,rgba(101,178,213,.35),transparent 70%)}
  .insightbox .k{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--wf-blue-l);font-weight:700}
  .insightbox h2{font-weight:800;font-size:25px;margin:8px 0 10px;line-height:1.2;letter-spacing:-.01em}
  .insightbox p{color:#d4ebf5;font-size:15px;max-width:780px}
  .insightbox .stat{display:inline-block;font-weight:800;color:#fff;border-bottom:2px solid var(--wf-green)}

  .act{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);margin-bottom:14px;overflow:hidden;display:flex}
  .act .pri{width:8px;flex-shrink:0}
  .act .inner{padding:18px 20px;flex:1}
  .act .atop{display:flex;align-items:center;gap:10px;margin-bottom:6px;flex-wrap:wrap}
  .act h4{font-size:16px;color:var(--wf-blue-d);font-weight:700}
  .act .pill{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;padding:3px 9px;border-radius:6px}
  .act p{font-size:14px;color:#33425c}
  .act .owner{font-size:12px;color:var(--wf-muted);margin-top:8px}
  .act .owner b{color:var(--wf-blue-d)}
  .p-red{background:var(--risk)}.p-amber{background:var(--warning)}.p-blue{background:var(--wf-blue)}.p-green{background:var(--healthy)}.p-grey{background:#9aa6b8}
  .pill-red{background:var(--risk-bg);color:#b3303b}.pill-amber{background:var(--warning-bg);color:#a9760a}.pill-blue{background:var(--wf-blue-bg);color:#1d6a93}.pill-green{background:var(--healthy-bg);color:#3a7d00}.pill-grey{background:#eef1f6;color:#5a6678}

  .retro{background:#fff;border:2px dashed var(--line);border-radius:14px;padding:20px 22px;margin-top:8px}
  .retro h4{color:var(--wf-blue-d);font-size:18px;margin-bottom:10px;font-weight:700}
  .retro li{margin:8px 0 8px 18px;font-size:14px;color:#33425c}
  .retro li b{color:var(--wf-blue-d)}

  .reslinks{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px;box-shadow:var(--shadow);margin-top:24px}
  .reslinks .rt{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--wf-muted);font-weight:700;margin-bottom:12px}
  .reslinks .rgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
  @media(max-width:860px){.reslinks .rgrid{grid-template-columns:1fr}}
  .rlink{display:flex;align-items:center;gap:10px;padding:11px 13px;border:1px solid var(--line);border-radius:10px;font-size:13.5px;font-weight:600;color:var(--wf-blue-d);transition:.15s;background:#fbfdfe}
  .rlink:hover{border-color:var(--wf-blue-l);background:var(--wf-blue-bg);text-decoration:none}
  .rlink .ico{width:30px;height:30px;border-radius:8px;background:var(--wf-blue-bg);display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0}

  footer{border-top:1px solid var(--line);padding:22px 0;color:var(--wf-muted);font-size:12px;text-align:center}
  .legend-inline{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--wf-muted);margin-top:10px;justify-content:center}
  .legend-inline span{display:inline-flex;align-items:center;gap:6px}
  .legend-inline i{width:10px;height:10px;border-radius:3px;display:inline-block}

.statblock{margin:14px 0 12px;padding-top:12px;border-top:1px solid var(--line)}
.sb{display:grid;grid-template-columns:1fr auto auto auto;gap:4px 10px;align-items:baseline;font-size:13px;padding:5px 0}
.sb+.sb{border-top:1px dashed #eef2f8}
.sb-head{font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--wf-muted);font-weight:700;padding-bottom:0}
.sb-head span:not(:first-child){text-align:right;min-width:52px}
.sb .sk{color:var(--wf-text)}
.sb .sv{text-align:right;font-weight:700;font-variant-numeric:tabular-nums;min-width:52px}
.sb .sd{text-align:right;font-weight:600;font-variant-numeric:tabular-nums;min-width:52px;font-size:12.5px}
.ctxline{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:12px;color:var(--wf-muted);margin:0 0 12px}
.ctxline i{font-style:normal;color:#9aa6b8}
.spark{height:34px;margin:2px 0 12px;display:block;width:100%}
.spark-cap{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--wf-muted);font-weight:700;margin-bottom:3px}
.spill{margin-top:12px;border:1px solid var(--line);border-radius:10px;padding:11px 13px;background:#fbfcfe}
.spill .sk{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--wf-muted);font-weight:700}
.spill .sv{font-size:22px;font-weight:800;color:var(--risk);font-variant-numeric:tabular-nums;line-height:1.2;text-align:left}
.spill .sn{font-size:12px;color:var(--wf-muted)}
@media(max-width:640px){.sb{font-size:12px;grid-template-columns:1fr auto auto auto}.sb .sv,.sb .sd,.sb-head span:not(:first-child){min-width:44px}}


.sprintsec{margin:14px 0 0;padding-top:12px;border-top:1px solid var(--line)}
.sprintsec>.sk{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--wf-muted);font-weight:700;margin-bottom:7px}
.tisbar{display:flex;height:26px;border-radius:7px;overflow:hidden;background:#eef2f8;margin:4px 0 8px}
.tisbar span{display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;min-width:2px;
 border-right:2px solid var(--card);white-space:nowrap;overflow:hidden}
.tisbar span:last-child{border-right:0}
.tiskey{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:11.5px;color:var(--wf-muted)}
.tiskey b{color:var(--wf-text)}
.tisdot{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.goalbox{border:1px dashed var(--line);border-radius:10px;padding:11px 13px;background:#fbfcfe;font-size:13px;color:var(--wf-muted)}
.goalbox b{color:var(--wf-text)}
.healthrow{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:8px 0 14px}
.hcell{background:#f6f9fd;border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.hcell .hk{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--wf-muted);font-weight:700}
.hcell .hv{font-size:23px;font-weight:800;line-height:1.25;color:var(--wf-blue-d)}
.hcell .hn{font-size:11.5px;color:var(--wf-muted)}
.activewrap{border:2px solid var(--wf-blue);border-radius:16px;padding:16px;background:linear-gradient(180deg,#f4f9fd,var(--card) 90px);margin-bottom:22px}
.activetag{display:inline-flex;align-items:center;gap:6px;font-size:10.5px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;
 color:#fff;background:var(--wf-blue);padding:4px 10px;border-radius:999px;margin-bottom:10px}

/* ---- collapsible sprint cards ---- */
#scrum .cmpcard.spc{padding:0;overflow:hidden;transition:border-color .15s ease,box-shadow .15s ease}
#scrum .cmpcard.spc>.sprinthead{cursor:pointer;margin:0;padding:14px 18px;user-select:none;
 display:flex;align-items:center;gap:12px;flex-wrap:wrap;border-radius:14px;transition:background .15s ease}
#scrum .cmpcard.spc:not(.open)>.sprinthead:hover{background:#f2f7fc}
#scrum .cmpcard.spc:not(.open):hover{border-color:var(--wf-blue);box-shadow:0 2px 10px rgba(0,124,188,.10)}
#scrum .cmpcard.spc>.sprinthead h3{margin:0;font-size:17px}
#scrum .cmpcard.spc .sprintdates{margin-left:auto;font-size:12.5px;color:var(--wf-muted);white-space:nowrap}
#scrum .spc .spcsum{font-size:12.5px;color:var(--wf-muted);white-space:nowrap}
#scrum .spc.open .spcsum{display:none}
#scrum .spc .spctoggle{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--wf-blue);
 background:#eaf4fb;border:1px solid #cfe5f4;border-radius:999px;padding:5px 12px;white-space:nowrap}
#scrum .spc:not(.open)>.sprinthead:hover .spctoggle{background:var(--wf-blue);border-color:var(--wf-blue);color:#fff}
#scrum .spc .spctoggle .cv{transition:transform .18s ease;font-size:10px}
#scrum .spc.open .spctoggle{background:#f0f4f8;border-color:var(--line);color:var(--wf-muted)}
#scrum .spc.open .spctoggle .cv{transform:rotate(180deg)}
#scrum .spc .spcbody{display:none;padding:0 18px 18px}
#scrum .spc.open .spcbody{display:block}
#scrum .spc+.spc{margin-top:12px}
@media(max-width:640px){#scrum .cmpcard.spc .sprintdates{margin-left:0;width:100%;order:9}
 #scrum .spc .spcsum{white-space:normal}}
@media(max-width:640px){.healthrow{grid-template-columns:repeat(2,1fr)}}
</style>
