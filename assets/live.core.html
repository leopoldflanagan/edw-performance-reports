<script>
/* Live panel — reads data/live.json, written by the scheduled Action.
   Everything else on the site stays static. If the file is missing or stale,
   the panel says so instead of showing nothing.

   Two rules this file exists to keep:
     1. one number for "how far in are we" — day N of M, everywhere;
     2. nothing that is not knowable yet gets a value. A sprint on day 2 has
        no spillover and no verdict, so it shows neither. */
(function () {
  var host = document.getElementById('livepanel');
  if (!host) return;
  // One script, two pages. The index shows a card you can read in five seconds;
  // sprint.html shows everything. Duplicating the rendering would guarantee the
  // two drift apart, which is exactly what a summary must never do.
  var FULL = (window.__LIVE_MODE__ === 'full');

  var STCOL = {
    'Ready for Development': '#65B2D5', 'In Development': '#007CBC',
    'Awaiting Review': '#ED7D31', 'Backlog': '#c3cdda', 'To Do': '#c3cdda',
    'Closed': '#4FA800', "Won't Do": '#9aa6b8'
  };
  var MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

  var esc = function (s) {
    return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  };
  var day = function (iso) {                    // "2026-09-14" -> "Sep 14"
    if (!iso) return '';
    var p = String(iso).slice(0, 10).split('-');
    return p.length === 3 ? MON[+p[1] - 1] + ' ' + (+p[2]) : esc(iso);
  };
  var ago = function (iso) {
    var m = Math.round((Date.now() - new Date(iso).getTime()) / 60000);
    if (!isFinite(m)) return '';
    if (m < 2) return 'less than a minute ago';
    if (m < 60) return m + ' min ago';
    var h = Math.round(m / 60);
    return h < 24 ? h + 'h ago' : Math.round(h / 24) + 'd ago';
  };
  var clock = function (iso) {                  // "22:32 UTC" from the ISO stamp
    var t = String(iso || '').slice(11, 16);
    return t ? t + ' UTC' : '';
  };

  /* The old line at the foot said "updated 18 min ago" in body text, which is easy
     to miss and says nothing about whether that is fine. This states the verdict
     first and the time second. */
  function freshness(iso) {
    if (!iso || iso.slice(0, 4) === '1970') {
      return '<span class="fresh fresh-wait"><i></i>Waiting for the first refresh</span>';
    }
    var mins = Math.round((Date.now() - new Date(iso).getTime()) / 60000);
    var d = new Date(iso);
    var when = d.toLocaleString(undefined, { month: 'short', day: 'numeric',
                                             hour: 'numeric', minute: '2-digit' });
    var cls = mins > 90 ? 'fresh-bad' : (mins > 45 ? 'fresh-warn' : 'fresh-ok');
    var say = mins > 90 ? 'Data may be stale' : (mins > 45 ? 'Refresh running late' : 'Data up to date');
    return '<span class="fresh ' + cls + '" title="Last refresh ' + esc(iso) + '"><i></i>' +
      say + ' <b>&middot; ' + esc(when) + '</b></span>';
  }

  function tile(k, v, n, col) {
    return '<div class="hcell"><div class="hk">' + k + '</div>' +
      '<div class="hv"' + (col ? ' style="color:' + col + '"' : '') + '>' + v + '</div>' +
      '<div class="hn">' + n + '</div></div>';
  }

  function bar(dist) {
    var tot = 0, k;
    for (k in dist) tot += dist[k];
    if (!tot) return '';
    var pairs = Object.keys(dist).map(function (s) { return [s, dist[s]]; })
      .sort(function (a, b) { return b[1] - a[1]; });
    var bars = '', keys = '';
    pairs.forEach(function (p) {
      var pct = 100 * p[1] / tot, col = STCOL[p[0]] || '#c3cdda';
      bars += '<span style="width:' + pct.toFixed(1) + '%;background:' + col + '">' +
        (pct > 7 ? p[1] : '') + '</span>';
      keys += '<span><i class="tisdot" style="background:' + col + '"></i>' +
        esc(p[0]) + ' <b>' + p[1] + '</b></span>';
    });
    return '<div class="sprintsec"><div class="sk">Work distribution &middot; ' + tot +
      ' items</div><div class="tisbar">' + bars + '</div>' +
      '<div class="tiskey">' + keys + '</div></div>';
  }

  /* The burndown is drawn across the WHOLE sprint, not across the days that have
     happened. Stretching three days over the full width is what made it look like
     a broken chart: the line ended at the right edge as if the sprint were over. */
  function burndown(s, big) {
    var burn = s.burn, scope = s.scope;
    if (!burn || burn.length < 2) return '';
    var days  = s.days || (burn.length - 1);
    var slots = days;                                  // day 0 .. day `days`
    var W = 640, H = big ? 360 : 210, L = 34, R = 12, T = 14, B = 34;
    var hi = Math.max.apply(null, (scope || []).concat(burn)) || 1;
    hi = Math.ceil(hi / 10) * 10 || 10;
    // pick a tick count that divides the top of the scale, so the axis reads
    // 0-10-20-30-40-50 instead of 0-13-25-38-50
    var ticks = 4, tk;
    for (tk = 0; tk < 4; tk++) { var c = [5, 4, 6, 3][tk]; if (hi % c === 0) { ticks = c; break; } }
    var step = (W - L - R) / slots;
    var X = function (i) { return L + i * step; };
    var Y = function (v) { return T + (H - T - B) * (1 - v / hi); };
    var path = function (arr) {
      return arr.map(function (v, i) {
        return (i ? 'L' : 'M') + X(i).toFixed(1) + ',' + Y(v).toFixed(1);
      }).join(' ');
    };
    var grid = '', lab = '', g;
    for (g = 0; g <= ticks; g++) {
      var v = hi * g / ticks, y = Y(v).toFixed(1);
      grid += '<line x1="' + L + '" y1="' + y + '" x2="' + (W - R) + '" y2="' + y +
        '" stroke="#e2e8f0" stroke-width="1"/>';
      lab += '<text x="' + (L - 6) + '" y="' + (+y + 3.5) +
        '" text-anchor="end" font-size="10" fill="#626c84">' + Math.round(v) + '</text>';
    }
    var todayX = X(burn.length - 1);
    var area = (scope && scope.length)
      ? '<path d="' + path(scope) + ' L' + todayX.toFixed(1) + ',' + Y(0) +
        ' L' + X(0).toFixed(1) + ',' + Y(0) + ' Z" fill="rgba(195,205,218,.25)"/>' : '';
    var ideal = 'M' + X(0).toFixed(1) + ',' + Y(burn[0]).toFixed(1) +
                ' L' + X(slots).toFixed(1) + ',' + Y(0).toFixed(1);

    return (big ? '<div>' : '<div class="sprintsec">') +
      (big ? '' : '<div class="sk">Burndown &middot; story points remaining ' +
        '&middot; day ' + (s.day || burn.length) + ' of ' + days + '</div>') +
      (big ? '' : '<div class="bdzoom" role="button" tabindex="0" ' +
        'aria-label="Open the burndown full size">') +
      '<svg viewBox="0 0 ' + W + ' ' + H + '" style="width:100%;height:' +
      (big ? 'min(62vh,420px)' : '210px') + '" ' +
      'role="img" aria-label="Sprint burndown, story points remaining by day">' +
      grid + lab + area +
      '<path d="' + ideal + '" stroke="#c3cdda" stroke-dasharray="5 4" stroke-width="2" fill="none"/>' +
      (scope && scope.length ? '<path d="' + path(scope) +
        '" stroke="#9aa6b8" stroke-width="2" fill="none"/>' : '') +
      '<path d="' + path(burn) + '" stroke="#007CBC" stroke-width="3" fill="none" stroke-linejoin="round"/>' +
      '<line x1="' + todayX.toFixed(1) + '" y1="' + T + '" x2="' + todayX.toFixed(1) +
      '" y2="' + Y(0) + '" stroke="#ED7D31" stroke-width="1" stroke-dasharray="3 3"/>' +
      '<text x="' + (todayX + 4).toFixed(1) + '" y="' + (T + 9) +
      '" font-size="10" fill="#ED7D31" font-weight="700">today</text>' +
      '<line x1="' + L + '" y1="' + Y(0) + '" x2="' + (W - R) + '" y2="' + Y(0) +
      '" stroke="#c3cdda" stroke-width="1"/>' +
      '<text x="' + L + '" y="' + (H - 12) + '" font-size="10" fill="#626c84">' + day(s.start) + '</text>' +
      '<text x="' + (W - R) + '" y="' + (H - 12) +
      '" text-anchor="end" font-size="10" fill="#626c84">' + day(s.end) + '</text>' +
      '</svg>' + (big ? '' : '</div>') +
      '<div class="tiskey" style="margin-top:2px">' +
      '<span><i class="tisdot" style="background:#007CBC"></i>Remaining</span>' +
      '<span><i class="tisdot" style="background:#9aa6b8"></i>Total scope</span>' +
      '<span><i class="tisdot" style="background:#c3cdda"></i>Ideal burn</span>' +
      '</div></div>';
  }

  /* Same chart, full size, in the same modal shape the release reports use. */
  function wireZoom(s) {
    var hook = host.querySelector('.bdzoom');
    if (!hook) return;
    var m = document.createElement('div');
    m.className = 'lvmodal';
    m.innerHTML = '<div class="lvbox"><div class="lvhead"><h4></h4>' +
      '<button class="lvclose" aria-label="Close">&times;</button></div>' +
      '<div class="lvbody"></div></div>';
    document.body.appendChild(m);
    m.querySelector('h4').textContent = s.name + ' — burndown, day ' +
      (s.day || '?') + ' of ' + (s.days || '?');
    m.querySelector('.lvbody').innerHTML = burndown(s, true);
    function close() { m.classList.remove('open'); }
    function open()  { m.classList.add('open'); }
    hook.addEventListener('click', open);
    hook.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(); }
    });
    m.addEventListener('click', function (e) { if (e.target === m) close(); });
    m.querySelector('.lvclose').addEventListener('click', close);
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape') close(); });
  }

  /* Where work is piling up, and how fast each step clears.
     Two different numbers on purpose: a status can clear in a day and still be
     the bottleneck if fifteen items are queued behind it. */
  function agingBlock(a) {
    if (!a || !a.rows || !a.rows.length) return '';
    var top = Math.max.apply(null, a.rows.map(function (r) { return r.open; })) || 1;
    var rows = a.rows.map(function (r) {
      var stuck = r.over > 0;
      if (!r.open) {
        return '<tr style="opacity:.6"><td class="agst">' + esc(r.status) + '</td>' +
          '<td class="agbar"><b>0</b></td><td class="agnum">&mdash;</td>' +
          '<td class="agnum">&mdash;</td><td class="agsm">nothing waiting</td>' +
          '<td class="agnum">' + (r.clear_med == null ? '&mdash;' : r.clear_med + 'd') + '</td></tr>';
      }
      var col   = STCOL[r.status] || '#65B2D5';
      return '<tr>' +
        '<td class="agst">' + esc(r.status) + '</td>' +
        '<td class="agbar"><i style="width:' + (72 * r.open / top).toFixed(1) +
          '%;background:' + col + '"></i><b>' + r.open + '</b></td>' +
        '<td class="agnum"' + (stuck ? ' style="color:#c0392b;font-weight:800"' : '') + '>' +
          r.med_age + 'd</td>' +
        '<td class="agnum">' + (r.over || '&mdash;') + '</td>' +
        '<td class="agsm">' + esc(r.worst_key) + ' &middot; ' + r.max_age + 'd</td>' +
        '<td class="agnum">' + (r.clear_med == null ? '&mdash;' : r.clear_med + 'd') + '</td>' +
      '</tr>';
    }).join('');

    var lead = a.worst
      ? 'Most of the waiting is in <b>' + esc(a.worst) + '</b>.'
      : 'Nothing is queued in the workflow right now.';

    return '<div class="sprintsec"><div class="sk">Workflow aging &middot; ' +
      a.open_total + ' items open' +
      (a.stale ? ' &middot; ' + a.stale + ' sitting ' + a.stale_days + '+ days' : '') +
      '</div>' +
      '<div class="secsub" style="font-size:12.5px;margin:-2px 0 8px">' + lead +
      ' <b>Waiting</b> is how long the items sitting there now have been there; ' +
      '<b>clears in</b> is how long items took to get through that step over the ' +
      'last ' + a.window_days + ' days. A short clear time with a tall bar is a ' +
      'queue, not a slow step.' +
      (a.parked && Object.keys(a.parked).length
        ? ' Not counted here: ' + Object.keys(a.parked).map(function (k) {
            return a.parked[k] + ' in ' + esc(k);
          }).join(', ') + ' — those are backlog layers, not steps in the flow.'
        : '') +
      '</div>' +
      '<div class="agwrap"><table class="agtab"><thead><tr>' +
      '<th>Status</th><th>Open</th><th>Waiting (median)</th><th>' + a.stale_days +
      'd+</th><th>Oldest</th><th>Clears in</th>' +
      '</tr></thead><tbody>' + rows + '</tbody></table></div></div>';
  }


  /* Where the sprint lands. A range, because the spread between past sprints is the
     uncertainty and a single number would hide it. */
  function projBlock(pr, compact) {
    if (!pr) return '';
    if (pr.too_early) {
      return compact ? '' :
        '<div class="goalbox" style="margin-top:12px"><b>Too early to project.</b> ' +
        esc(pr.why) + '.</div>';
    }
    var cls = pr.pct >= 95 ? 'bh-shape' : (pr.pct >= 80 ? 'bh-fat' : 'bh-skinny');
    if (compact) {
      return '<div class="projline"><b>Projected close ' + pr.lo + '&ndash;' + pr.hi +
        ' pts</b> <span class="projpill ' + cls + '">' + pr.pct + '% of the ' +
        pr.committed + ' committed</span></div>';
    }
    return '<div class="sprintsec"><div class="sk">Projected close</div>' +
      '<div class="bh"><div class="hero">' +
        '<div class="bhstate ' + cls + '">' + esc(pr.verdict || '') + '</div>' +
        '<div class="hv">' + pr.lo + ' &ndash; ' + pr.hi +
          ' <span style="font-size:15px;font-weight:600">pts</span></div>' +
        '<div class="hs">most likely <b>' + pr.mid + '</b>' +
          (pr.pct != null ? ' &middot; ' + pr.pct + '% of the ' + pr.committed + ' committed' : '') +
        '</div></div>' +
        '<div class="bhband"><div class="hs">Built from where the team&rsquo;s last ' + pr.n +
        ' sprints stood at this same point of the way through &mdash; day ' + pr.day + ' of ' +
        pr.days + '. At that point they had finished a median of ' +
        Math.round(pr.share_mid * 100) + '% of what they would finish in total, and ' +
        pr.done_now + ' pts are done here.</div>' +
        '<div class="hs" style="margin-top:6px">The range is the spread between those ' +
        'sprints, not a margin of error: it is how differently this team has finished ' +
        'from the same position before.</div></div>' +
      '</div></div>';
  }

  function render(d) {
    var s = d.sprint, m = d.month, out = '';
    var first = !d.generated || d.generated.slice(0, 4) === '1970';
    var stale = !first && (Date.now() - new Date(d.generated).getTime()) > 45 * 60000;
    var live  = d.kind === 'active';

    var tag = live
      ? '<span class="activetag">&#9679; Active sprint</span>'
      : (d.kind === 'recent'
        ? '<span class="activetag" style="background:var(--wf-muted)">Most recent sprint</span>'
        : '<span class="activetag" style="background:var(--wf-muted)">No sprint open</span>');

    out += '<div class="activewrap">' +
      '<div class="liverow">' + tag + freshness(d.generated) + '</div>';

    if (s) {
      // the sprint being reported on is the headline, not the one after it
      out += '<div style="font-size:22px;font-weight:800;color:var(--wf-blue-d);line-height:1.2">' +
        esc(s.name) + '</div>' +
        '<div class="secsub" style="margin:2px 0 12px;font-size:13px;color:var(--wf-muted)">' +
        day(s.start) + ' &rarr; ' + day(s.end) +
        (s.day ? ' &middot; <b>day ' + s.day + ' of ' + s.days + '</b>' : '') +
        // planned capacity, from the page the Scrum Master fills at planning
        (s.capacity && s.capacity.members
          ? ' &middot; ' + s.capacity.members + ' people' +
            (s.capacity.pct != null ? ' &middot; capacity ' + s.capacity.pct + '%' : '') +
            (s.capacity.pto ? ' (' + s.capacity.pto + 'd PTO)' : '') +
            (s.capacity.holidays ? ' (' + s.capacity.holidays + ' holiday' +
              (s.capacity.holidays > 1 ? 's' : '') + ')' : '')
          : '') +
        (live ? '' : ' &middot; closed') + '</div>';
    }

    if (!s) {
      out += '<div class="secsub" style="margin-bottom:10px">No sprint is open on this board right now.' +
        (d.next ? ' <b>' + esc(d.next.name) + '</b> is created with a start date of ' +
          esc(day(d.next.start)) + ' and has not been started.' : '') + '</div>';
    }

    if (s) {
      var pace = (s.day && s.days) ? Math.round(100 * s.day / s.days) : null;
      var openPts = Math.round((s.spill ? s.spill.open_pts + s.spill.out_pts : 0));
      var openIt  = s.spill ? s.spill.open_items + s.spill.out_items : 0;

      out += '<div class="healthrow">' +
        tile('Work complete', (s.vs_commitment == null ? '&mdash;' : s.vs_commitment + '%'),
          s.completed + ' of ' + s.committed + ' pts committed') +
        tile('Sprint elapsed', (s.day ? 'Day ' + s.day : '&mdash;'),
          (s.days ? 'of ' + s.days + (pace == null ? '' : ' &middot; ' + pace + '% of the sprint') : '')) +
        tile('Scope change', (s.scope_change == null ? '&mdash;' : '+' + s.scope_change + '%'),
          s.committed + ' &rarr; ' + s.final + ' pts',
          s.scope_change ? 'var(--warning)' : null) +
        (live
          // during a sprint nothing has spilled over yet: it is still open work
          ? tile('Still open', openPts + ' pts',
              openIt + ' items &middot; spillover is known when the sprint closes ' + day(s.end))
          : tile('Spillover', (s.spill_rate == null ? '&mdash;' : s.spill_rate + '%'),
              openPts + ' pts carried out of the sprint', 'var(--risk)')) +
        '</div>';

      if (live && !FULL) out += projBlock(d.projection, true);
      if (live && FULL) {
        out += projBlock(d.projection, false);
        out += '<div class="goalbox" style="margin:0 0 12px">This sprint is <b>in progress</b>. ' +
          'The numbers above are a position on day ' + (s.day || 1) + ' of ' + (s.days || '?') +
          ', not a result &mdash; it gets a verdict in the release report once it closes.</div>';
      }

      if (FULL) {
        out += bar(s.dist);
        out += burndown(s);
      }
      if (FULL) out += '<div class="goalbox" style="margin-top:12px">' + (s.goal
        ? '<b>Sprint goal' + (s.goal_src ? ' (from the ' + esc(s.goal_src) + ')' : '') +
          '.</b> ' + esc(s.goal) +
          (s.committed_planned != null && s.committed_planned !== s.committed
            ? ' <span style="color:var(--wf-muted)">Planning recorded ' + s.committed_planned +
              ' pts committed; Jira reconstructs ' + s.committed + '. The gap is what moved after planning.</span>'
            : '')
        : '<b>No goal recorded in Jira or on the capacity page for this sprint.</b> Without one there is nothing to measure delivery against beyond the point count.') +
        '</div>';
    }

    if (m && FULL) {
      var isRel = m.kind === 'release';
      // a release is counted in sprints; only the calendar-month fallback counts days
      var head = isRel
        ? esc(m.label) + ' so far &middot; ' + (m.sprints_done == null ? '' :
            m.sprints_done + ' of ' + m.n_sprints + ' sprints closed &middot; ') +
          'ends ' + day(m.end)
        : esc(m.label) + ' so far &middot; day ' + m.day +
          (m.days ? ' of ' + m.days : '') + ' &middot; calendar month';
      out += '<div class="sprintsec"><div class="sk">' + head + '</div>' +
        '<div class="healthrow" style="margin-bottom:0">' +
        tile('Closed', m.closed, 'items ' + (isRel ? 'this release' : 'this month')) +
        tile('Story points', m.points, 'delivered so far') +
        tile('Unplanned', (m.unplanned_pct == null ? '&mdash;' : m.unplanned_pct + '%'),
          (m.unplanned_pct == null
            ? 'no item carries the Unplanned label or the Urgent Task type'
            : m.unplanned + ' of ' + m.closed + ' items')) +
        tile('Team', (d.capacity && d.capacity.team ? d.capacity.team.length : '\u2014'),
          // the roster and who actually closed work are different questions, and the
          // gap between them is the interesting part
          (d.capacity && d.capacity.team
            ? 'on the roster &middot; ' + m.people_active + ' closed work'
            : m.people_active + ' closed 2+ items')) +
        '</div>' +
        (isRel && m.sprints ? '<div class="secsub" style="margin-top:8px;font-size:12px">' +
          'Sprints in this release: ' + m.sprints.map(esc).join(', ') + '</div>' : '') +
        '</div>';
    }

    if (FULL) out += agingBlock(d.aging);

    if (d.next && FULL) {
      out += '<div class="secsub" style="margin-top:12px;font-size:12.5px">Next up: <b>' +
        esc(d.next.name) + '</b>, starting ' + day(d.next.start) + '.</div>';
    }

    out += (FULL
      ? '<div class="secsub" style="margin-top:14px;font-size:12.5px">' +
        '<a href="index.html">&larr; back to the reports</a> &middot; ' +
        '<a href="admin.html">board hygiene</a></div>'
      : '<a class="fulllink" href="sprint.html">See the full sprint &rarr;</a>');
    out += '</div>';
    host.innerHTML = out;
    if (s) wireZoom(s);
  }

  fetch('data/live.json?t=' + Date.now(), { cache: 'no-store' })
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(render)
    .catch(function () {
      host.innerHTML = '<div class="activewrap"><span class="activetag" ' +
        'style="background:var(--wf-muted)">Live panel</span>' +
        '<div class="goalbox">Live data is not available yet. Once the refresh job has run ' +
        'at least once, the current sprint and the release in progress appear here.</div></div>';
    });
})();

</script>
